version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform_test
      POSTGRES_PASSWORD: platform_test
      POSTGRES_DB: platform_test
    ports:
      - "5433:5432"
    volumes:
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_test"]
      interval: 2s
      timeout: 2s
      retries: 10
